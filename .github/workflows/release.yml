name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && (inputs.version != '' && format('Release {0}', startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) || 'Ensaio de empacotamento (sem publicar)')
  || github.event.pull_request.title }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: 1.1.0): atualiza os submódulos, empacota, cria a tag e o release. Vazio só empacota, sem publicar."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Atualizar submódulos
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit com os submódulos no main de cada repositório
        id: commit
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Versão inválida: $INPUT_VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
            echo "A tag v$version já existe." >&2
            exit 1
          fi
          git submodule update --init --remote backend front
          if [[ -n "$(git status --porcelain backend front)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend front
            git commit -m "chore: submódulos para a v$version"
          fi
          git push origin "HEAD:refs/heads/release/v$version"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Instalador ${{ matrix.label }}
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 gera o .deb com nomes de dependência que também instalam no 24.04 e no Debian 12.
          - { label: Linux, os: ubuntu-22.04, type: deb }
          - { label: Windows, os: windows-latest, type: msi }
          - { label: macOS Apple Silicon, os: macos-15, type: dmg }
          - { label: macOS Intel, os: macos-15-intel, type: dmg }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar WiX (jpackage .msi)
        if: matrix.type == 'msi'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2

      - name: Versão
        id: version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0-ci${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar
        run: packaging/package.sh "${{ steps.version.outputs.value }}" "${{ matrix.type }}"

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: packaging/dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    if: needs.prepare.result == 'success'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Nomes fixos (sem versão) para o README apontar sempre para a última
      # versão via releases/latest/download/<arquivo>. A versão fica na tag e
      # no título da release. Renomeia antes do SHA-256 e da attestation, então
      # os dois já enxergam só os nomes finais.
      - name: Renomear instaladores para nomes fixos
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mv "ats-resume-optimizer-$VERSION-x64.msi"   ats-resume-optimizer-windows-x64.msi
          mv "ats-resume-optimizer-$VERSION-arm64.dmg" ats-resume-optimizer-macos-arm64.dmg
          mv "ats-resume-optimizer-$VERSION-x64.dmg"   ats-resume-optimizer-macos-x64.dmg
          mv "ats-resume-optimizer-$VERSION-x64.deb"   ats-resume-optimizer-linux-x64.deb
          ls -l

      - name: SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "ATS Resume Optimizer $VERSION" \
            --generate-notes \
            $prerelease

  cleanup:
    name: Remover branch temporária
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Apagar release/v${{ needs.prepare.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/v${{ needs.prepare.outputs.version }}"
